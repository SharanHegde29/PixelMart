{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-lg animate__animated animate__fadeInUp" style="background-color: #2c3035; border: 1px solid #444;">
            <div class="card-header bg-warning text-dark text-center">
                <h4 class="mb-0">{{ title }} 🛠️</h4>
            </div>
            <div class="card-body p-4 text-white">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-warning w-100 hover-grow">Save Product</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
